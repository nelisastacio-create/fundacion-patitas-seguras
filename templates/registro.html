<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Fundación Patitas Seguras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    :root{
      --bg:#f6f1e8;
      --white:#ffffff;
      --text:#222222;
      --muted:#666666;
      --primary:#d2a14a;
      --primary-dark:#b8862d;
      --line:#eadfcd;
      --shadow:0 15px 35px rgba(0,0,0,.10);
    }

    body{
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .container{
      width:min(1220px,95%);
      margin:auto;
    }

    .navbar{
      width:100%;
      padding:20px 0;
      background:#a9a39c;
      border-bottom:1px solid rgba(255,255,255,.15);
    }

    .nav-content{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      flex-wrap:wrap;
    }

    .brand img{
      width:150px;
      height:auto;
      display:block;
    }

    .nav-links{
      display:flex;
      align-items:center;
      gap:28px;
      flex-wrap:wrap;
    }

    .nav-links a{
      color:#fff;
      font-size:1rem;
      font-weight:500;
    }

    .page-wrap{
      width:min(620px,95%);
      margin:50px auto;
      background:#fff;
      border-radius:30px;
      box-shadow:var(--shadow);
      padding:38px 34px;
      border:1px solid #f0e7d7;
    }

    .mini-logo{
      width:100px;
      height:auto;
      display:block;
      margin:0 auto 18px;
    }

    h1{
      text-align:center;
      font-size:2rem;
      margin-bottom:10px;
    }

    .subtitle{
      text-align:center;
      color:var(--muted);
      line-height:1.8;
      margin-bottom:28px;
      font-size:.96rem;
    }

    .form-group{
      margin-bottom:16px;
    }

    .form-group label{
      display:block;
      margin-bottom:8px;
      font-weight:600;
      font-size:.95rem;
    }

    .form-group input{
      width:100%;
      border:1px solid var(--line);
      background:#fffdf9;
      border-radius:16px;
      padding:15px 16px;
      font-size:.96rem;
      outline:none;
    }

    .btn{
      width:100%;
      border:none;
      border-radius:999px;
      padding:15px 18px;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
    }

    .btn-primary{
      background:var(--primary);
      color:white;
      margin-top:8px;
    }

    .mensaje-error{
      background:#fdeaea;
      color:#9f2e2e;
      border:1px solid #f4c4c4;
      padding:12px 14px;
      border-radius:14px;
      margin-bottom:16px;
      font-size:.95rem;
    }

    .extra-links{
      margin-top:18px;
      text-align:center;
      color:var(--muted);
      font-size:.95rem;
      line-height:1.8;
    }

    .extra-links a{
      color:#b8862d;
      font-weight:700;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container nav-content">
      <div class="brand">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Fundación Patitas Seguras">
      </div>

<div class="nav-links">
  <a href="/">Inicio</a>
  <a href="/historia">Nuestra historia</a>
  <a href="/mascotas">Mascotas</a>
  <a href="/formularios">Formularios</a>
  <a href="/solicitudes">Solicitudes</a>

  {% if session.get('usuario_id') %}
    <a href="/logout" class="login-btn">Cerrar sesión</a>
  {% else %}
    <a href="/login" class="login-btn">Iniciar sesión</a>
  {% endif %}
</div>
    </div>
  </nav>

  <div class="page-wrap">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Fundación Patitas Seguras" class="mini-logo">

    <h1>Crear cuenta</h1>
    <p class="subtitle">
      Registra tu perfil para acceder al sistema de adopciones.
    </p>

    {% if mensaje %}
    <div class="mensaje-error">{{ mensaje }}</div>
    {% endif %}

    <form method="POST" action="/registro">
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••••" required>
      </div>

      <div class="form-group">
        <label for="confirmar_password">Confirmar contraseña</label>
        <input type="password" id="confirmar_password" name="confirmar_password" placeholder="••••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary">Crear cuenta</button>
    </form>

    <div class="extra-links">
      ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
    </div>
  </div>

</body>
</html>
